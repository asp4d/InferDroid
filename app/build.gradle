plugins {
    alias(libs.plugins.android.application)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def machineProperties = new Properties()
def machinePropertiesFile = rootProject.file('local.properties')
if (machinePropertiesFile.exists()) {
    machinePropertiesFile.withInputStream { machineProperties.load(it) }
}

android {
    namespace 'dev.inferdroid'
    compileSdk 37
    ndkVersion '30.0.14904198-beta1'
    // Optional unpacked NDK location; omitted when installed using SDK Manager.
    if (machineProperties.getProperty('inferdroid.ndkPath')) {
        ndkPath machineProperties.getProperty('inferdroid.ndkPath')
    }

    defaultConfig {
        applicationId 'dev.inferdroid'
        minSdk 31
        targetSdk 36
        versionCode 9
        versionName '0.9.0'
        testInstrumentationRunner 'dev.inferdroid.engine.EngineManagerInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static' }
        }
        buildConfigField "String", "AUTHOR_NAME", "\"Alessandro Spadini\""
        buildConfigField "String", "AUTHOR_WEBSITE", "\"https://spadini.dev\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    // AGP packages the CMake IMPORTED runtime automatically. Stage only the
    // dynamically loaded dispatch and runtime's DT_NEEDED constraint provider.
    sourceSets.main.jniLibs.srcDirs = [layout.buildDirectory.dir('generated/runtimeJniLibs')]
    packaging {
        jniLibs {
            // Dispatch needs a real nativeLibraryDir, not a path inside the APK.
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libLiteRtDispatch_GoogleTensor.so', '**/libGemmaModelConstraintProvider.so']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.14.0'
}

def runtimeDirectory = rootProject.file('native/artifacts/arm64-v8a')
def runtimeSources = [
        'Inference adapter': rootProject.file('native/runtime_adapter.cc'),
        'Inference API': rootProject.file('native/runtime_api.h'),
        'Inference build': rootProject.file('native/BUILD.bazel')
]
def verifyNativeRuntime = tasks.register('verifyNativeRuntime') {
    inputs.files(runtimeSources.values())
    inputs.files(fileTree(runtimeDirectory))
    doLast {
        def rebuildMessage = 'Run scripts/build-native.sh before building the APK; see README.md.'
        def versions = new File(runtimeDirectory, 'VERSIONS.txt')
        def checksums = new File(runtimeDirectory, 'SHA256SUMS')
        if (!versions.isFile() || !checksums.isFile()) {
            throw new GradleException("Native runtime build metadata is missing. ${rebuildMessage}")
        }
        def sha256 = { File source ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            source.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int count
                while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            digest.digest().encodeHex().toString()
        }
        def metadata = versions.readLines('UTF-8')
        runtimeSources.each { label, source ->
            if (!metadata.contains("${label} SHA-256 ${sha256(source)}".toString())) {
                throw new GradleException("Native runtime is out of date for ${source.name}. ${rebuildMessage}")
            }
        }
        def recordedHashes = [:]
        checksums.eachLine('UTF-8') { line ->
            def entry = line.split(/\s+/, 2)
            if (entry.length == 2) recordedHashes[new File(entry[1]).name] = entry[0]
        }
        ['libinferdroid_litertlm.so', 'libLiteRtDispatch_GoogleTensor.so',
         'libGemmaModelConstraintProvider.so'].each { name ->
            def library = new File(runtimeDirectory, name)
            if (!library.isFile() || recordedHashes[name] != sha256(library)) {
                throw new GradleException("Native runtime library ${name} is missing or does not match its build metadata. ${rebuildMessage}")
            }
        }
    }
}

def stageRuntimeLibraries = tasks.register('stageRuntimeLibraries', Sync) {
    dependsOn(verifyNativeRuntime)
    from(rootProject.file('native/artifacts/arm64-v8a')) {
        include 'libLiteRtDispatch_GoogleTensor.so', 'libGemmaModelConstraintProvider.so'
    }
    into(layout.buildDirectory.dir('generated/runtimeJniLibs/arm64-v8a'))
}
tasks.named('preBuild').configure { dependsOn(stageRuntimeLibraries) }
