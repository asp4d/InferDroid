// Authored overlay sources are versionable; all generated state stays local.
def overlaySource = gradle.startParameter.initScripts.find { it.name == 'enable.gradle' }.canonicalFile.parentFile
def privateOverlay = new File(overlaySource, '../../../.local/tensor-g5/android').canonicalFile
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(new File(privateOverlay, "build/${project.name}"))
    if (project.path == ':app') {
        project.pluginManager.withPlugin('com.android.application') {
          project.extensions.getByName('androidComponents').finalizeDsl { android ->
            android.defaultConfig.applicationId = 'dev.inferdroid.imagesresearch'
            android.defaultConfig.testInstrumentationRunner = project.findProperty('inferdroidImageRegressions') == 'true' ? 'dev.inferdroid.engine.EngineManagerInstrumentation' : 'dev.inferdroid.images.ImageInstrumentation'
            android.sourceSets.main.java.setSrcDirs([new File(privateOverlay, 'generated/java')])
            android.sourceSets.debug.res.srcDir(new File(privateOverlay, 'generated/res'))
            android.sourceSets.main.assets.srcDir(new File(privateOverlay, 'generated/assets'))
            android.sourceSets.main.manifest.srcFile(new File(privateOverlay, 'generated/AndroidManifest.xml'))
            android.sourceSets.main.jniLibs.srcDir(new File(privateOverlay, 'generated/jniLibs'))
            android.sourceSets.androidTest.java.srcDir(new File(overlaySource, 'src/androidTest/java'))
            android.externalNativeBuild.cmake.path = new File(overlaySource, 'CMakeLists.txt')
            android.externalNativeBuild.cmake.buildStagingDirectory = new File(privateOverlay, 'cxx')
          }
        }
    }
}
